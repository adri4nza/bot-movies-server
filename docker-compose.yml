services:
  # ============================================
  # QBITTORRENT — Cliente de torrents
  # ============================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  # ============================================
  # PROWLARR — Gestor de indexadores
  # ============================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # ============================================
  # RADARR — Gestor de películas
  # ============================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
    volumes:
      - ./config/radarr:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  # ============================================
  # SONARR — Gestor de series
  # ============================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
    volumes:
      - ./config/sonarr:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  # ============================================
  # PLEX — Media Server (Agregado para ti)
  # ============================================
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
      - VERSION=docker
    volumes:
      - ./config/plex:/config
      - ./media/movies:/movies
      - ./media/tv:/tv
    restart: unless-stopped

  # ============================================
  # TELEGRAM BOT — Bot con Inteligencia Artificial
  # ============================================
  telegram-bot:
    build: ./
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

  # ============================================
  # HERRAMIENTAS DE RED (Evasión de bloqueos)
  # ============================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=America/Caracas
    ports:
      - 8191:8191
    restart: unless-stopped

  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - WARP_SLEEP=2
    ports:
      - 1080:1080
    volumes:
      - ./config/warp:/var/lib/cloudflare-warp

  # overseerr:
  #   image: sctx/overseerr:latest
  #   container_name: overseerr
  #   environment:
  #     - TZ=America/Caracas
  #   volumes:
  #     - ./overseerr_config:/app/config
  #   ports:
  #     - 5055:5055
  #   restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - TZ=America/Caracas
    ports:
      - 5055:5055
    volumes:
      - ./overseerr_config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./portainer_data:/data
  #   ports:
  #     - 9000:9000
  #   restart: unless-stopped

  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      - ./homarr/configs:/app/data/configs
      - ./homarr/icons:/app/public/icons
      - ./homarr/data:/data
    ports:
      - '7575:7575'

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
    volumes:
      - ./jellyfin-config:/config
      - ./media/tv:/data/tvshows
      - ./media/movies:/data/movies
    ports:
      - 8096:8096
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: "host"
    privileged: true
    volumes:
      - ./tailscale-config:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Caracas
      - SUBDOMAINS=adri4nza-movies
      - TOKEN=${DUCKDNS_TOKEN}
    restart: unless-stopped

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt
    restart: unless-stopped